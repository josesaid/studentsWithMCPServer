# =============================================
# APPLICATION: Students
# Generated by Spring Boot Scaffold Generator
# =============================================
spring.application.name=students
server.port=8101

# =============================================
# DATABASE
# =============================================
spring.datasource.url=jdbc:h2:mem:studentsdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# MySQL (production) — uncomment to use:
# spring.datasource.url=jdbc:mysql://scaffold-mysql:3306/studentsdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=said
# Database password hidden: not stored in the repository. Set the value through the
# environment (SPRING_DATASOURCE_PASSWORD) when using MySQL.
# spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =============================================
# SPRINGDOC / SWAGGER UI
# =============================================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.packages-to-scan=com.mx.development.jose.said.controller
# =============================================
# LOGGING
# =============================================
logging.level.com.mx.development.jose.said=DEBUG
logging.level.org.springframework.web=INFO

# =============================================
# MCP SERVER (Spring AI)
# =============================================
# Excluir ToolCallbackConverterAutoConfiguration evita que Spring AI intente
# listar las tools del MCP client durante el arranque del contexto (antes de
# que Tomcat esté escuchando en 8101). StudentCreationAgent usa
# SyncMcpToolCallbackProvider directamente, por lo que no depende de este bean.
spring.autoconfigure.exclude=org.springframework.ai.mcp.server.common.autoconfigure.ToolCallbackConverterAutoConfiguration
# Expone las tools de com.mx.development.jose.said.mcp.StudentsMcpTools
spring.ai.mcp.server.name=students-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.instructions=Servidor MCP del microservicio Students: expone operaciones CRUD y utilidades sobre estudiantes.
spring.ai.mcp.server.type=SYNC

# =============================================
# MCP CLIENT (demo AppClientSample -> se conecta al propio MCP server)
# =============================================
# initialized=false: el handshake 'initialize' se dispara a mano en
# AppClientSample.run() (CommandLineRunner), para garantizar que el server
# embebido (Tomcat) ya esté escuchando en el puerto 8101 antes de conectarse.
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.name=students-mcp-client-demo
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.streamable-http.connections.students-server.url=http://localhost:8101
spring.ai.mcp.client.streamable-http.connections.students-server.endpoint=/mcp

# =============================================
# ANTHROPIC (Claude) - StudentCreationAgent
# =============================================
# La API key se toma de la variable de entorno ANTHROPIC_API_KEY.
# Expórtala antes de correr la app: export ANTHROPIC_API_KEY=sk-ant-...
# (nunca queda escrita en este archivo ni en el zip)
# API key hidden: this value is not stored in the repository. Set the environment variable ANTHROPIC_API_KEY before running the app.
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.options.model=claude-sonnet-4-6
spring.ai.anthropic.chat.options.max-tokens=1024
